name: Run Unit Tests

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch/Tag/SHA to test'
        required: true
  pull_request:
  push:

jobs:
  run-unit-tests:
    name: Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (push/pull request)
        uses: actions/checkout@v4
        if: github.event_name != 'workflow_dispatch'

      - name: Checkout (workflow_dispatch)
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
        if: github.event_name == 'workflow_dispatch'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      # The scanner, server-boot and rate-limit characterization suites skip themselves without ffmpeg/ffprobe
      # (about 130 tests), which would leave CI green while they prove nothing.
      - name: Ensure ffmpeg is available
        run: command -v ffmpeg && command -v ffprobe || (sudo apt-get update && sudo apt-get install -y ffmpeg)

      - name: Run tests
        run: npm test

      # Re-runs the suite and fails if a snapshot entry was not compared (a skipped suite), a route is unhit, etc.
      - name: Characterization audit
        run: npm run audit:characterization
